[[faq]]
q = "How do I install a stufently MCP plugin in Claude Code?"
a = "Run claude plugin marketplace add stufently/claude-plugins and then claude plugin install zabbix-ai-cli-mcp@stufently-mcp, or inside a session /plugin marketplace add stufently/claude-plugins followed by /plugin."

[[faq]]
q = "Which plugins are in the marketplace?"
a = "zabbix-ai-cli-mcp, google-webtools-mcp, bing-webmaster-ai-cli-mcp, yandex-metrica-mcp, aviasales-mcp and telegram-ai-cli-mcp, each with two scenarios."

[[faq]]
q = "Where are my API tokens stored?"
a = "Secret values go to the system credential store, the rest to pluginConfigs in your settings.json. The plugin passes them to the server through its environment; no value is stored in the repository."

[[faq]]
q = "Can the plugins change my Zabbix or Bing Webmaster data?"
a = "Not by default. The Zabbix plugin fixes ZABBIX_AI_CLI_MCP_ALLOW_WRITE=false and the Bing plugin fixes BING_WM_ALLOW_WRITES=false, so Bing writes only record a plan you apply with bing-wm plan apply."

[[faq]]
q = "What do I need installed?"
a = "Docker for the docker plugins and uv for the uvx plugin (Bing Webmaster). The Telegram plugin needs tg-ai on PATH with a signed-in account."

[[faq]]
q = "Does it work in Cursor?"
a = "Yes. The repository is also a Cursor plugin marketplace: each Cursor plugin bundles the MCP server, the scenarios as skills, a slash command per scenario and a rule with the server's safety limits."
